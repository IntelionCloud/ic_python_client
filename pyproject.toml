[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelion-cloud"
version = "0.6.0"
description = "Python client for the Intelion Cloud API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Intelion Cloud", email = "support@intelion.cloud" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://intelion.cloud"
Documentation = "https://intelion.cloud/swagger/"
Repository = "https://github.com/IntelionCloud/ic_python_client"

[tool.setuptools.packages.find]
include = ["intelion_cloud*"]
