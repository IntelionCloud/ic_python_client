name: Release to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag: $TAG_VERSION, pyproject.toml: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $FILE_VERSION"
            exit 1
          fi

      - name: Verify tag matches intelion_cloud/__init__.py __version__
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          DUNDER_VERSION=$(python -c "import re; m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('intelion_cloud/__init__.py').read()); print(m.group(1))")
          echo "Tag: $TAG_VERSION, __init__.py: $DUNDER_VERSION"
          if [ "$TAG_VERSION" != "$DUNDER_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match __version__ $DUNDER_VERSION in intelion_cloud/__init__.py"
            exit 1
          fi

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # TODO: switch back to OIDC Trusted Publishing once PyPI project-level
    # publisher is correctly configured. See CLAUDE.md "Trusted Publishing".
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (API token fallback)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
